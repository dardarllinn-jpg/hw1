<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際防線｜太空射擊</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            color: #eaf7ff;
            background: #030611;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            user-select: none;
            touch-action: none;
        }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .hud { position: fixed; z-index: 2; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 28px; pointer-events: none; }
        .brand { color: #8eeaff; font-size: 12px; letter-spacing: .3em; text-shadow: 0 0 18px #36cfff; }
        .stats { display: flex; gap: clamp(18px, 5vw, 64px); text-align: right; }
        .stat-label { display: block; color: #8296b9; font-size: 10px; letter-spacing: .2em; }
        .stat-value { display: block; margin-top: 3px; font-size: 22px; font-weight: 700; letter-spacing: .08em; }
        .health-wrap { position: fixed; z-index: 2; top: 82px; left: 28px; width: 150px; pointer-events: none; }
        .health-label { color: #8296b9; font-size: 10px; letter-spacing: .18em; margin-bottom: 7px; }
        .health-track { height: 5px; background: #15213b; border-radius: 5px; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #36e6cb, #85f9ff); box-shadow: 0 0 12px #36e6cb; transition: width .2s; }
        .sound-button { position: fixed; z-index: 4; right: 24px; bottom: 22px; color: #aec2df; background: #101b32aa; border: 1px solid #53658066; padding: 9px 13px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .sound-button:hover { border-color: #71e9ff; color: white; }
        .overlay { position: fixed; z-index: 3; inset: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, #08142bbd 0%, #03061188 70%); }
        .panel { width: min(440px, 100%); text-align: center; padding: 42px 30px; border: 1px solid #8beaff38; border-radius: 20px; background: linear-gradient(145deg, #101b32e8, #080d1ded); box-shadow: 0 0 80px #0c70a522, inset 0 1px #ffffff10; }
        .eyebrow { color: #75e8ff; letter-spacing: .3em; font-size: 11px; }
        h1 { margin: 12px 0 8px; font-size: clamp(30px, 8vw, 48px); letter-spacing: .08em; }
        .description { margin: 0 auto 25px; color: #9cacc6; line-height: 1.8; font-size: 14px; }
        .start-button { border: 0; border-radius: 999px; padding: 13px 35px; color: #04101b; background: linear-gradient(90deg, #78f1dc, #80dfff); font: inherit; font-weight: 800; letter-spacing: .1em; cursor: pointer; box-shadow: 0 0 26px #51dff366; }
        .start-button:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .hint { margin-top: 19px; color: #6f819f; font-size: 12px; }
        .mobile-controls { display: none; position: fixed; z-index: 2; inset: auto 18px 22px; justify-content: space-between; pointer-events: none; }
        .mobile-controls button { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; color: #c9f8ff; background: #16304c99; border: 1px solid #79dfff77; font-size: 23px; touch-action: none; }
        .mobile-controls .fire { width: 72px; height: 72px; color: #071321; background: #75e8ffdd; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
        .move-buttons { display: flex; gap: 10px; }
        @media (max-width: 700px) {
            .hud { padding: 17px 18px; }
            .brand { font-size: 10px; }
            .stat-value { font-size: 18px; }
            .health-wrap { left: 18px; top: 67px; }
            .mobile-controls { display: flex; }
            .sound-button { right: 18px; bottom: 105px; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="game" aria-label="太空射擊遊戲畫面"></canvas>
    <header class="hud">
        <div class="brand">✦ STAR DEFENDER</div>
        <div class="stats">
            <div><span class="stat-label">SCORE</span><span class="stat-value" id="score">000000</span></div>
            <div><span class="stat-label">BEST</span><span class="stat-value" id="best">000000</span></div>
        </div>
    </header>
    <div class="health-wrap"><div class="health-label">SHIP INTEGRITY</div><div class="health-track"><div class="health-fill" id="health"></div></div></div>
    <button class="sound-button" id="soundButton" aria-label="切換音效">♪ 音效：開</button>
    <div class="mobile-controls" id="mobileControls">
        <div class="move-buttons"><button data-move="left" aria-label="向左">◀</button><button data-move="right" aria-label="向右">▶</button></div>
        <button class="fire" data-move="fire">FIRE</button>
    </div>
    <div class="overlay" id="overlay">
        <div class="panel">
            <div class="eyebrow">深空防衛任務</div>
            <h1 id="overlayTitle">星際防線</h1>
            <p class="description" id="overlayText">駕駛戰機迎擊來襲的敵艦，盡可能守住防線！</p>
            <button class="start-button" id="startButton">開始任務</button>
            <div class="hint">移動：← → 或 A / D　・　射擊：空白鍵</div>
        </div>
    </div>
    <script>
        (() => {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const startButton = document.getElementById('startButton');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlayText = document.getElementById('overlayText');
            const scoreNode = document.getElementById('score');
            const bestNode = document.getElementById('best');
            const healthNode = document.getElementById('health');
            const soundButton = document.getElementById('soundButton');
            const keys = Object.create(null);
            const stars = [];
            const bullets = [];
            const enemies = [];
            const particles = [];
            let width = 0, height = 0, player, score = 0, best = 0, health = 100;
            let running = false, lastTime = 0, spawnTimer = 0, shotTimer = 0, audio = null, soundOn = true;
            try { best = Number(localStorage.getItem('starDefenderBest')) || 0; } catch (_) {}
            bestNode.textContent = String(best).padStart(6, '0');

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                if (player) player.y = height - (height < 600 ? 105 : 90);
                if (stars.length === 0) for (let i = 0; i < 120; i++) stars.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 1.5 + .3, speed: Math.random() * 35 + 15, alpha: Math.random() * .65 + .2 });
            }
            function initAudio() {
                if (!soundOn) return;
                if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
            }
            function tone(frequency, duration, type, volume, endFrequency) {
                if (!soundOn) return;
                initAudio();
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();
                oscillator.type = type || 'sine';
                oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
                if (endFrequency) oscillator.frequency.exponentialRampToValueAtTime(endFrequency, audio.currentTime + duration);
                gain.gain.setValueAtTime(volume, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                oscillator.connect(gain); gain.connect(audio.destination);
                oscillator.start(); oscillator.stop(audio.currentTime + duration);
            }
            function resetGame() {
                score = 0; health = 100; spawnTimer = 0; shotTimer = 0;
                bullets.length = 0; enemies.length = 0; particles.length = 0;
                player = { x: width / 2, y: height - (height < 600 ? 105 : 90), w: 30, h: 38, speed: 390, invulnerable: 0 };
                scoreNode.textContent = '000000'; healthNode.style.width = '100%';
            }
            function startGame() {
                initAudio(); resetGame(); running = true; overlay.style.display = 'none'; lastTime = performance.now();
                requestAnimationFrame(loop);
            }
            function endGame() {
                running = false;
                if (score > best) {
                    best = score; bestNode.textContent = String(best).padStart(6, '0');
                    try { localStorage.setItem('starDefenderBest', best); } catch (_) {}
                }
                overlayTitle.textContent = '任務結束';
                overlayText.textContent = `本次得分：${score}　・　最高紀錄：${best}`;
                startButton.textContent = '再次出擊'; overlay.style.display = 'grid';
            }
            function fire() {
                bullets.push({ x: player.x, y: player.y - 21, r: 3.5, speed: 640 });
                tone(680, .09, 'square', .035, 390);
            }
            function burst(x, y, color, amount = 12) {
                for (let i = 0; i < amount; i++) {
                    const angle = Math.random() * Math.PI * 2, speed = Math.random() * 150 + 35;
                    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .35 + Math.random() * .45, max: .8, size: Math.random() * 3 + 1, color });
                }
            }
            function spawnEnemy() {
                const size = Math.random() * 12 + 20;
                enemies.push({ x: Math.random() * (width - size * 2) + size, y: -size, r: size, speed: Math.random() * 75 + 105 + Math.min(score / 100, 110), drift: (Math.random() - .5) * 70, hp: size > 27 ? 2 : 1, phase: Math.random() * Math.PI * 2 });
            }
            function update(dt) {
                stars.forEach(s => { s.y += s.speed * dt; if (s.y > height) { s.y = 0; s.x = Math.random() * width; } });
                if (!running) return;
                player.invulnerable = Math.max(0, player.invulnerable - dt);
                const left = keys.ArrowLeft || keys.a || keys.A || keys.left;
                const right = keys.ArrowRight || keys.d || keys.D || keys.right;
                if (left) player.x -= player.speed * dt;
                if (right) player.x += player.speed * dt;
                player.x = Math.max(22, Math.min(width - 22, player.x));
                if ((keys[' '] || keys.fire) && shotTimer <= 0) { fire(); shotTimer = .19; }
                shotTimer -= dt;
                spawnTimer -= dt;
                if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(.32, .9 - score / 4500) * (.65 + Math.random() * .65); }
                bullets.forEach(b => b.y -= b.speed * dt);
                enemies.forEach(e => { e.y += e.speed * dt; e.x += Math.sin(e.phase += dt * 2) * e.drift * dt; });
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    if (b.y < -10) { bullets.splice(i, 1); continue; }
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                            bullets.splice(i, 1); e.hp--;
                            if (e.hp <= 0) { enemies.splice(j, 1); score += 100; scoreNode.textContent = String(score).padStart(6, '0'); burst(e.x, e.y, '#ff8c76', 15); tone(180, .2, 'sawtooth', .06, 65); }
                            else burst(e.x, e.y, '#ffd979', 5);
                            break;
                        }
                    }
                }
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (e.y > height + e.r) { enemies.splice(i, 1); health -= 12; }
                    else if (player.invulnerable <= 0 && Math.hypot(player.x - e.x, player.y - e.y) < e.r + 17) {
                        enemies.splice(i, 1); health -= 24; player.invulnerable = .8; burst(player.x, player.y, '#73eaff', 20); tone(110, .3, 'sawtooth', .09, 45);
                    }
                }
                particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.vx *= .985; p.vy *= .985; });
                for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
                health = Math.max(0, health); healthNode.style.width = health + '%';
                if (health <= 0) endGame();
            }
            function drawShip(x, y) {
                ctx.save(); ctx.translate(x, y);
                ctx.shadowColor = '#51eaff'; ctx.shadowBlur = 20;
                ctx.fillStyle = '#8ef4ff'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(16, 15); ctx.lineTo(0, 9); ctx.lineTo(-16, 15); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#d8fdff'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, 7); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#4ba8ff'; ctx.fillRect(-4, 15, 8, 7 + Math.random() * 7);
                ctx.restore();
            }
            function draw() {
                ctx.clearRect(0, 0, width, height);
                const gradient = ctx.createLinearGradient(0, 0, 0, height); gradient.addColorStop(0, '#050918'); gradient.addColorStop(1, '#080d20');
                ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
                stars.forEach(s => { ctx.globalAlpha = s.alpha; ctx.fillStyle = '#c5eaff'; ctx.fillRect(s.x, s.y, s.r, s.r); }); ctx.globalAlpha = 1;
                bullets.forEach(b => { ctx.shadowColor = '#6cf4ff'; ctx.shadowBlur = 15; ctx.fillStyle = '#b5fbff'; ctx.fillRect(b.x - 2, b.y - 9, 4, 15); }); ctx.shadowBlur = 0;
                enemies.forEach(e => {
                    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI);
                    ctx.shadowColor = '#ff665d'; ctx.shadowBlur = 16; ctx.fillStyle = e.hp > 1 ? '#ff9b68' : '#fa667b';
                    ctx.beginPath(); ctx.moveTo(0, -e.r); ctx.lineTo(e.r * .9, e.r * .35); ctx.lineTo(e.r * .45, e.r * .2); ctx.lineTo(0, e.r * .75); ctx.lineTo(-e.r * .45, e.r * .2); ctx.lineTo(-e.r * .9, e.r * .35); ctx.closePath(); ctx.fill(); ctx.restore();
                });
                particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }); ctx.globalAlpha = 1;
                if (player && (player.invulnerable <= 0 || Math.floor(performance.now() / 90) % 2 === 0)) drawShip(player.x, player.y);
            }
            function loop(time) {
                const dt = Math.min((time - lastTime) / 1000, .04); lastTime = time;
                update(dt); draw(); if (running) requestAnimationFrame(loop);
            }
            window.addEventListener('keydown', event => {
                if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
                keys[event.key] = true;
                if (event.key === ' ' && !running) startGame();
            });
            window.addEventListener('keyup', event => { keys[event.key] = false; });
            window.addEventListener('blur', () => { Object.keys(keys).forEach(key => keys[key] = false); });
            startButton.addEventListener('click', startGame);
            soundButton.addEventListener('click', () => { soundOn = !soundOn; soundButton.textContent = soundOn ? '♪ 音效：開' : '♪ 音效：關'; if (soundOn) initAudio(); });
            document.querySelectorAll('[data-move]').forEach(button => {
                const action = button.dataset.move;
                button.addEventListener('pointerdown', event => { event.preventDefault(); keys[action] = true; if (action === 'fire' && !running) startGame(); });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => button.addEventListener(type, () => { keys[action] = false; }));
            });
            window.addEventListener('resize', resize);
            resize(); resetGame(); draw();
        })();
    </script>
</body>
</html>
